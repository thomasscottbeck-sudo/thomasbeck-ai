<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Scott Beck</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://thomasbeck.ai/">
<style>
:root { --blue: #00356B; --ink: #242B33; --bg: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root { --blue: #9CC0EA; --ink: #E6EBF0; --bg: #0E1216; } }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; border-top: 3px solid var(--blue); }
h1 { margin: 0; font-weight: 400; font-size: clamp(28px, 6vw, 44px); letter-spacing: -.01em; color: var(--blue); }
</style>
</head>
<body><h1>Thomas Scott Beck</h1></body>
</html>
