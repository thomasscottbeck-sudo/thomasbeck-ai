<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Scott Beck</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://thomasbeck.ai/">
<meta property="og:type" content="profile"><meta property="og:title" content="Thomas Scott Beck"><meta property="og:description" content="Systems and operations. Salt Lake City, Utah."><meta property="og:url" content="https://thomasbeck.ai/"><meta property="og:image" content="https://thomasbeck.ai/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#0c1216" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#e6ebe6" media="(prefers-color-scheme: light)"><link rel="icon" href="https://thomasbeck.ai/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#0c1216;--ink:#e9eeeb;--muted:#9fb0b8;--edge:rgba(255,255,255,.11);
--field:radial-gradient(1100px 760px at 14% 8%,rgba(58,104,128,.42) 0%,rgba(58,104,128,0) 62%),radial-gradient(900px 700px at 88% 62%,rgba(84,112,66,.28) 0%,rgba(84,112,66,0) 60%);
--glass:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.025) 42%,rgba(0,0,0,.16))}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#e6ebe6;--ink:#17302f;--muted:#4d6067;--edge:rgba(255,255,255,.85);
--field:radial-gradient(1100px 760px at 14% 8%,rgba(140,195,218,.5) 0%,rgba(140,195,218,0) 62%),radial-gradient(900px 700px at 88% 62%,rgba(190,214,150,.45) 0%,rgba(190,214,150,0) 60%);
--glass:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.42) 45%,rgba(255,255,255,.28))}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--field),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;padding:24px;box-sizing:border-box}
.card{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:36px;background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:26px 44px 26px 26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.28),0 30px 80px rgba(0,0,0,.35);max-width:640px;width:100%}
.portrait{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:6px;border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 40px rgba(0,0,0,.4)}
@media (max-width:560px){.card{grid-template-columns:1fr;gap:22px;padding:22px 26px 30px}.portrait{max-width:260px}}
h1{margin:0;font-weight:600;font-size:clamp(30px,5.5vw,44px);letter-spacing:-.035em;line-height:1.05}
p{margin:14px 0 0;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nf{font-size:clamp(24px,4vw,32px);color:var(--muted)}
</style>
</head>
<body><div class="card"><img class="portrait" src="portrait.jpg" width="720" height="900" alt="Thomas Scott Beck"><div><h1 class="nf">Nothing here.</h1><h1 hidden>Thomas Scott Beck</h1><p>Systems &amp; operations</p></div></div></body>
</html>
